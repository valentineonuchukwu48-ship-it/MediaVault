plugins {
    id 'com.android.application'
}

android {
    namespace 'com.valentineonuchukwu.facebookgrabcontents.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.valentineonuchukwu.facebookgrabcontents.mobile"
        minSdk 24
        // Compile/target stay at 34: the app has no Play Store target today,
        // and 34-target apps run fine on every current Android version.
        targetSdk 34
        versionCode 1
        versionName project.findProperty('mobileVersion') ?: '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
