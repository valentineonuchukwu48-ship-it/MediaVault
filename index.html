    <script>
      // Install-anywhere plumbing:
      //  1) keep Chrome's install prompt available to the UI
      //  2) register the service worker (required for Android install)
      (function() {
        window.__fgcInstallEvent = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__fgcInstallEvent = e;
          window.dispatchEvent(new CustomEvent('fgc:installable'));
        });
        window.addEventListener('appinstalled', function() {
          window.__fgcInstallEvent = null;
          window.dispatchEvent(new CustomEvent('fgc:installed'));
        });
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch ? originalFetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
